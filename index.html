<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometric Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf3ff;--gr:#d3e3f7;--panel:#fff;--ink:#1b2a49;--mute:#5b6b8c;--line:#d5e2f5;--sun:#ffc93c;--f:'Fredoka',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--f);color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.scr{display:none;height:100%}.scr.on{display:flex}
.btn{--c:#3a5bd9;--d:color-mix(in srgb,var(--c) 66%,#000);border:0;border-radius:14px;padding:.5em 1em;font:600 1rem var(--f);color:#fff;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 85%,#000));box-shadow:0 5px 0 var(--d),0 10px 14px rgba(20,40,90,.22);cursor:pointer;transition:transform .08s,box-shadow .08s;margin-bottom:5px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d),0 3px 6px rgba(20,40,90,.25)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,.logo:focus-visible,.mc:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
.card{background:var(--panel);border-radius:20px;box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 7px 0 var(--line),0 16px 26px rgba(20,40,90,.16)}
#intro{background:linear-gradient(160deg,#f7fbff,#d8e8ff);align-items:center;justify-content:center;text-align:center;overflow:auto;position:relative}
#intro:before,#game:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.in{position:relative;padding:20px;max-width:900px}
.scene{width:150px;height:150px;margin:60px auto 70px;position:relative;perspective:800px}
.cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube b{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;color:#fff;border:4px solid rgba(255,255,255,.75);border-radius:16px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.cube b:nth-child(1){transform:translateZ(75px);background:#ef476f}.cube b:nth-child(2){transform:rotateY(90deg) translateZ(75px);background:#118ab2}.cube b:nth-child(3){transform:rotateY(180deg) translateZ(75px);background:#06a77d}.cube b:nth-child(4){transform:rotateY(-90deg) translateZ(75px);background:#f4a300}.cube b:nth-child(5){transform:rotateX(90deg) translateZ(75px);background:#7b5cff}.cube b:nth-child(6){transform:rotateX(-90deg) translateZ(75px);background:#ff7a1a}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.shadow{position:absolute;left:10px;right:10px;bottom:-62px;height:26px;border-radius:50%;background:radial-gradient(rgba(27,42,73,.3),transparent 70%)}
.fl{position:absolute;width:44px;height:44px;animation:flt 4s ease-in-out infinite}.fl.a{left:-90px;top:10px;background:#ffc93c;clip-path:polygon(50% 0,100% 100%,0 100%)}.fl.b{right:-100px;top:60px;background:#06a77d;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);animation-delay:-1.5s}.fl.c{left:-60px;bottom:-10px;background:#ef476f;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);animation-delay:-3s}
@keyframes flt{50%{transform:translateY(-16px) rotate(20deg)}}
h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.05;margin:0;color:#2748b8;text-shadow:0 1px 0 #cfdcff,0 2px 0 #b7c9f8,0 3px 0 #9fb5f0,0 4px 0 #879fe6,0 5px 0 #7088dc,0 14px 20px rgba(39,72,184,.3)}
.sub{font-size:clamp(1.1rem,3vw,1.5rem);color:#e0761a;margin:18px 0 30px;font-weight:600}.auth{margin-top:34px;color:var(--mute);font-size:.95rem}
#start{--c:#06a77d;font-size:1.7rem;padding:.5em 2em;border-radius:18px}
#game{position:relative;display:none;grid-template-columns:1fr clamp(340px,33vw,440px);gap:14px;padding:14px;background:var(--bg)}#game.on{display:grid}#game>*{position:relative}
#vis{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;min-height:0;padding:58px 16px 16px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px) rotateX(5deg)}}
.corner{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}.corner .btn{margin:0;padding:.35em .8em}
#side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:0 6px 8px 2px}
#teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:900px}
.team{--c:#999;padding:8px 10px 4px;border-top:8px solid var(--c);display:grid;grid-template-columns:48px 1fr;gap:4px 8px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;border:3px solid #fff;font-size:1.6rem;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff,color-mix(in srgb,var(--c) 30%,#fff));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000),0 8px 10px rgba(0,0,0,.2);padding:0}.logo:active{transform:translateY(3px)}
.tn{font:700 1.05rem var(--f);color:var(--c);background:transparent;border:2px dashed transparent;border-radius:9px;padding:2px 6px;width:100%;min-width:0}.tn:hover,.tn:focus{border-color:var(--c);outline:0}
.sc{grid-column:1/-1;display:flex;align-items:center;gap:6px}.sc small{flex:1;color:var(--mute);font-weight:600}
.score{font:700 2.5rem/1 var(--f);color:var(--c);text-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000),0 4px 0 color-mix(in srgb,var(--c) 40%,#000),0 10px 10px rgba(0,0,0,.25)}.score.pop{animation:pop .4s}@keyframes pop{40%{transform:scale(1.4)}}
.plus{--c:var(--tc);margin:0;padding:.35em .9em}
#pk{position:fixed;z-index:40;display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(20,40,90,.35);width:216px}#pk.on{display:grid}
#pk button{font-size:1.6rem;border:0;background:#eef4ff;border-radius:10px;cursor:pointer;padding:4px}#pk button:hover{background:#ffe9a8}
#tm{padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
#td{font:700 2.7rem/1 var(--f);color:#2748b8;min-width:2.6ch;text-align:center;text-shadow:0 2px 0 #9fb5f0,0 5px 0 #7088dc,0 10px 10px rgba(0,0,0,.2)}#td.end{color:#e63946;animation:shk .4s 3}
.tsel{display:flex;flex-wrap:wrap;gap:5px}.tsel button{border:2px solid var(--line);background:#f3f7ff;border-radius:10px;font:600 .85rem var(--f);padding:3px 8px;cursor:pointer;color:var(--ink)}.tsel button.on{background:#2748b8;border-color:#2748b8;color:#fff}.tsel button:disabled{opacity:.5;cursor:not-allowed}
.tbar{grid-column:1/-1;height:8px;border-radius:6px;background:#e3ecfa;box-shadow:inset 0 2px 3px rgba(0,0,0,.12);overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#06a77d,#ffc93c);transition:width .1s linear}
.trow{grid-column:1/-1;display:flex;gap:8px}.trow .btn{margin:0;flex:1;padding:.3em}
#cc{flex:1 0 auto;padding:12px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.chip{background:#2748b8;color:#fff;padding:5px 14px;border-radius:999px;font-weight:600;box-shadow:0 4px 0 #1a3585}
.small{padding:.3em .8em;font-size:.88rem;--c:#7b5cff;margin:0}
.fbox{background:linear-gradient(145deg,#f3f8ff,#fff);border-radius:22px;padding:14px;width:min(100%,760px);box-shadow:inset 0 3px 8px rgba(20,40,90,.1),0 8px 0 var(--line)}
.fig{width:100%;height:auto;display:block}.fig .sh{filter:drop-shadow(0 8px 0 rgba(27,42,73,.22))}.fig .pt{stroke:#1b2a49;stroke-width:2.5;stroke-linejoin:round}.fig .ol{fill:none;stroke:#1b2a49;stroke-width:4;stroke-linejoin:round}.fig .tk line{stroke:#1b2a49;stroke-width:3;stroke-linecap:round}
.fig text{font-family:var(--f);font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#1b2a49;stroke:#fff;stroke-width:5px;paint-order:stroke}
.note{font-size:.85rem;color:var(--mute);margin:8px 0 0;text-align:center}
.story{font-size:1.05rem;line-height:1.5;margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{font-size:1.15rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=number],select{font:600 1.1rem var(--f);padding:.4em .6em;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);box-shadow:inset 0 3px 5px rgba(20,40,90,.1);width:120px}select{width:auto}
.fb{margin-top:12px;padding:10px 14px;border-radius:14px;font-weight:500;line-height:1.4}.fb:empty{display:none}.fb.ok{background:#d6f5ea;color:#05694f;box-shadow:0 4px 0 #9fdcc6}.fb.no{background:#ffe0e3;color:#a3162a;box-shadow:0 4px 0 #f3a9b1;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.board{background:repeating-linear-gradient(#fffdf4 0 31px,#cfe0f7 31px 32px);border-radius:14px;padding:10px;border-left:6px solid #ef9aa6;box-shadow:0 5px 0 var(--line)}.board h4{margin:0 0 6px;font-size:1.05rem}
.step{display:block;width:100%;text-align:left;background:rgba(255,255,255,.75);border:2px solid transparent;border-radius:10px;padding:6px 10px;margin-bottom:6px;font:500 1rem var(--f);color:var(--ink);cursor:pointer}.step:hover{border-color:#b7c9f8}.step.sel{border-color:#ff9f1c;background:#fff2d6}.step span{display:block;font-weight:700;font-size:1.1rem;color:#2748b8}
[hidden]{display:none!important}
.fm{width:min(100%,calc((100dvh - 150px)*1.55));height:auto;display:block;border-radius:16px;box-shadow:0 8px 0 #4a6a25,0 18px 26px rgba(0,0,0,.22);touch-action:none;user-select:none;cursor:crosshair;background:#6b8f3a}
.fm text{font-family:var(--f);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fm .pill rect{fill:#fff;stroke:#1b2a49;stroke-width:2.5}.fm .pill text{font-weight:700;font-size:14px;fill:#1b2a49}
.fm .pill.hot rect{fill:#ffe0e3;stroke:#e63946}.fm .pill.hot text{fill:#a3162a}
.fm .dim{opacity:0;transition:opacity .3s;pointer-events:none}.fm .dim.on{opacity:1}
.fm .sdl{stroke:#e63946;stroke-width:12;stroke-linecap:round;opacity:0;pointer-events:none}.fm .sdl.on{opacity:.9;animation:blink .5s 3}
@keyframes blink{50%{opacity:.2}}
.fm .fp.new{transform-box:fill-box;transform-origin:center;animation:fpop .25s}@keyframes fpop{from{transform:scale(.3);opacity:0}}
.stp{display:flex;gap:6px;margin:0 0 8px}.stp span{flex:1;text-align:center;border-radius:10px;padding:4px 6px;font-weight:600;font-size:.9rem;background:#eef3fb;color:var(--mute)}.stp span.on{background:#2748b8;color:#fff}.stp span.dn{background:#d6f5ea;color:#05694f}
.hv{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-weight:600;color:var(--mute);flex-wrap:wrap}.hv i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef3fb;border:2px dashed #c3d3ee;font-size:1.2rem;color:#b3c2de}.hv i.on{background:#fff3c4;border:2px solid #ffc93c;color:inherit;animation:pop .4s}.hv small{margin-left:auto}
.fc{font-weight:600;margin:6px 0}
.eq{font:700 1.25rem var(--f);background:#fff0f1;border:2px solid #f3a9b1;border-radius:12px;padding:8px 12px;margin:8px 0;text-align:center}.eq span{opacity:.25;transition:opacity .2s}.eq span.on{opacity:1;color:#c1121f}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tile{--c:#999;border:3px solid transparent;border-radius:12px;background:var(--c);padding:7px;font:600 .92rem var(--f);color:#2a2a2a;cursor:grab;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000);text-align:left}.tile.sel{border-color:var(--ink);transform:translateY(-2px)}.tile.fn{background:repeating-linear-gradient(90deg,#b07a3f 0 6px,#8a5a28 6px 8px);color:#fff}
.meas{display:grid;gap:6px;margin:8px 0}.meas label{display:flex;align-items:center;gap:8px;font-weight:600}.meas input{width:90px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,calc((100dvh - 150px)*1.5))}
.mc{aspect-ratio:3/2;border:3px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:2px;box-shadow:0 5px 0 var(--line),0 10px 14px rgba(20,40,90,.14);transition:transform .1s;font:700 clamp(1rem,2.3vw,1.8rem) var(--f);color:#2748b8;overflow:hidden}
.mc svg{width:100%;height:100%}.mc.sel{border-color:#ff9f1c;transform:translateY(-4px) scale(1.03);background:#fff7e0}.mc.done{background:var(--pc);border-color:color-mix(in srgb,var(--pc) 60%,#000);cursor:default;box-shadow:none;transform:none}.mc.bad{animation:shk .4s;border-color:#e63946}
.log{margin:0 0 8px;padding-left:20px;font-size:.95rem;line-height:1.4;max-height:130px;overflow:auto}
.halo{fill:rgba(255,201,60,.5);transform-box:fill-box;transform-origin:center;animation:hp 1.2s ease-in-out infinite}@keyframes hp{50%{transform:scale(1.3)}}
.bub{fill:#fff!important;stroke:#1b2a49!important;stroke-width:6px!important}
#tp{display:flex;align-items:center;gap:10px;padding:8px 12px}.bulb{font-size:2rem;filter:drop-shadow(0 0 10px var(--sun));animation:glow 2.5s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 20px #ff9f1c)}}
#tip{flex:1;line-height:1.35;font-size:.95rem}#nt{--c:#f4a300;margin:0;padding:.3em .7em;font-size:.85rem}
#home{--c:#e63946}#goalb{--c:#f4a300}#mute{--c:#6c7a9c}
.modal{position:fixed;inset:0;background:rgba(27,42,73,.45);display:none;place-items:center;z-index:45;padding:16px}.modal.on{display:grid}.mbox{padding:22px;text-align:center;max-width:400px;width:100%}.mbox h3{margin:0 0 6px;font-size:1.5rem}.mbox .tsel{justify-content:center;margin:10px 0}.mbox .tsel button{font-size:1.1rem;padding:6px 14px}.mbox .row{justify-content:center}
#wl{font-size:5rem;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3));animation:bob 1.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.on{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
#fx .big{position:absolute;left:50%;top:42%;font-size:min(34vw,220px);transform:translate(-50%,-50%);animation:bigp 1.3s forwards;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3))}@keyframes bigp{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(8deg);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
#fx .up,#fx .dn{position:absolute;animation:up 2s ease-out forwards}#fx .up{bottom:-60px}#fx .dn{top:-60px;animation-name:dn}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg)}}@keyframes dn{to{transform:translateY(110vh) rotate(-30deg)}}
@media (max-width:900px){#game.on{display:block;height:auto;min-height:100%}#vis{min-height:300px;margin-bottom:14px}.fm,.mg{width:100%}#side{overflow:visible}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<section id="intro" class="scr on"><div class="in">
<div class="scene"><i class="fl a"></i><i class="fl b"></i><i class="fl c"></i><div class="cube"><b>▲</b><b>■</b><b>⬠</b><b>⬡</b><b>◆</b><b>⬢</b></div><div class="shadow"></div></div>
<h1>Geometric Challenge</h1>
<p class="sub">Grade 5 · Geometry · Perimeter</p>
<button class="btn" id="start">Start</button>
<p class="auth">Desing by David Beleño - Math Education - 2026</p></div></section>

<section id="game" class="scr">
<div id="vis" class="card"><div class="corner"><button class="btn" id="home" aria-label="Home">🏠 Home</button><button class="btn" id="goalb">🏆 Points</button><button class="btn" id="mute" aria-label="Sound on or off">🔊</button></div><div id="visin" style="width:100%;display:flex;flex-direction:column;align-items:center"></div></div>
<aside id="side">
<div id="teams"></div>
<div id="tm" class="card"><div id="td">10</div><div class="tsel" id="tsel"></div><div class="tbar"><i id="tb"></i></div><div class="trow"><button class="btn" id="tgo" style="--c:#06a77d">Start</button><button class="btn" id="trs" style="--c:#6c5ce7">Reset</button></div></div>
<div id="cc" class="card"><div class="bar"><span class="chip" id="chip"></span><button class="btn small" id="skip">Next challenge</button></div><div id="ui"></div></div>
<div id="tp" class="card"><span class="bulb">💡</span><div id="tip"></div><button class="btn" id="nt">Next tip</button></div>
</aside></section>

<div id="gm" class="modal"><div class="card mbox"><h3>🏆 Game goal</h3><p>The first team to reach this score wins the game.</p><div class="tsel" id="gsel"></div><div class="row"><input id="gcus" type="number" min="1" placeholder="Custom" aria-label="Custom goal"><button class="btn" id="gset" style="--c:#06a77d">Set goal</button></div><button class="btn" id="gx" style="--c:#6c7a9c">Close</button></div></div>
<div id="wm" class="modal"><div class="card mbox"><div id="wl">🏆</div><h3 id="wn"></h3><p>Congratulations, champions!</p><div class="row"><button class="btn" id="wagain" style="--c:#06a77d">Play again</button><button class="btn" id="wkeep" style="--c:#6c5ce7">Keep playing</button></div></div></div>
<div id="pk"></div><div id="toast"></div><div id="fx"></div>

<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],sum=a=>a.reduce((x,y)=>x+y,0),shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const teams=[{n:"Red Team",c:"#ef476f",l:"🦁",s:0},{n:"Blue Team",c:"#118ab2",l:"🦅",s:0}],LG=["🦁","🦅","🐯","🐬","🚀","⭐","🔥","⚡","🐼","🦊","🐲","🏆"],U=["cm","m","in","ft","yd"];
const PAL=["#ffd6e0","#d6ecff","#d9f5d0","#fff1b8","#e6dcff","#ffe0c2","#cdf3ee","#f9d9f2"];
let timer,bag=[],ti=0,goal=0;
/* sound */
let AC,mute=false;
function snd(t){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){return}
const T={click:[[700,.05,'square',.04]],good:[[523,.1],[659,.1],[784,.1],[1047,.3]],bad:[[260,.2,'sawtooth',.1],[190,.35,'sawtooth',.1]],point:[[988,.07],[1319,.35]],tick:[[900,.06,'square',.05]],alarm:[[880,.15,'square',.08],[660,.15,'square',.08],[880,.15,'square',.08],[660,.3,'square',.08]],start:[[392,.1],[523,.1],[659,.1],[784,.2]],next:[[500,.06],[750,.1]],win:[[523,.12],[659,.12],[784,.12],[1047,.12],[784,.12],[1047,.4]],step:[[330,.08,'triangle'],[392,.08,'triangle']]};
let at=AC.currentTime;(T[t]||[]).forEach(([f,d,w,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d);at+=d*.9})}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))snd('click')});
function burst(E,n,cls){const b=$('#fx'),g=document.createElement('div');g.className='big';g.textContent=pick(E);b.appendChild(g);setTimeout(()=>g.remove(),1400);
for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=pick(E);s.className=cls;s.style.left=R(3,95)+'%';s.style.fontSize=R(24,50)+'px';s.style.animationDelay=Math.random()*.5+'s';b.appendChild(s);setTimeout(()=>s.remove(),2600)}}

const f=t=>{const r=fast?1:Math.min(1,(t-t0)/600),qq=r<.5?2*r*r:1-Math.pow(-2*r+2,2)/2;setT(A[0]+(B[0]-A[0])*qq,A[1]+(B[1]-A[1])*qq);
if(r<1)return requestAnimationFrame(f);
$('#re'+j).style.opacity=1;$('#lb'+j).style.opacity=1;const b=$('#bub');b.textContent=lab(j);b.setAttribute('x',B[0]);b.setAttribute('y',B[1]-58);b.style.opacity=1;setTimeout(()=>b.style.opacity=0,fast?500:900);
const li=document.createElement('li');li.textContent=`${nm} walked ${j==hid?"a hidden distance (?)":L[j]+" "+u} from ${pl(j)} to ${pl(j+1)}.`;$('#log').appendChild(li);$('#log').scrollTop=999;snd('point');e++;setTimeout(leg,fast?0:120)};f(t0)};leg()}
trv.onclick=()=>{if(busy)fast=true;else{fast=false;run()}};trv.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();trv.onclick()}};
if(mode=="missing")$('#chk').onclick=()=>{if($('#chk').disabled)return;const x=parseFloat($('#ans').value);if(isNaN(x))return fb(0,"Type the hidden distance first.",1);const ks=ans-L[hid];
x==L[hid]?fb(1,`The known roads add up to ${L.filter((_,i)=>i!=hid).join(" + ")} = ${ks} ${u}. So the hidden road is ${ans} − ${ks} = ${L[hid]} ${u}. Give +1 to the winning team!`):fb(0,x==ans?"That is the total of the whole trip. Find only the hidden road.":"Add the known distances, then subtract that sum from the total.")};
else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=+b.dataset.v==ans;b.style.setProperty('--c',ok?'#06a77d':'#e63946');ok?fb(1,`The whole trip is ${L.join(" + ")} = ${ans} ${u}. Give +1 to the winning team!`):fb(0,"Add the distance of every road of the trip.")})}
</script></body></html>
