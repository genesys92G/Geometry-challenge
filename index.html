.log{margin:0 0 8px;padding-left:20px;font-size:.95rem;line-height:1.4;max-height:130px;overflow:auto}

#tp{display:flex;align-items:center;gap:10px;padding:8px 12px}.bulb{font-size:2rem;filter:drop-shadow(0 0 10px var(--sun));animation:glow 2.5s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 20px #ff9f1c)}}

#wl{font-size:5rem;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3));animation:bob 1.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}

@keyframes up{to{transform:translateY(-110vh) rotate(40deg)}}@keyframes dn{to{transform:translateY(110vh) rotate(-30deg)}}

.sbox{position:relative;width:min(100%,760px);padding:22px 24px;text-align:center}.sbox h2{margin:0 0 4px;font-size:2rem;color:#2748b8}

<section id="intro" class="scr on"><div class="in">

<script>

/* sound */
let AC,mute=false;

const T={click:[[700,.05,'square',.04]],good:[[523,.1],[659,.1],[784,.1],[1047,.3]],bad:[[260,.2,'sawtooth',.1],[190,.35,'sawtooth',.1]],point:[[988,.07],[1319,.35]],tick:[[900,.06,'square',.05]],alarm:[[880,.15,'square',.08],[660,.15,'square',.08],[880,.15,'square',.08],[660,.3,'square',.08]],start:[[392,.1],[523,.1],[659,.1],[784,.2]],next:[[500,.06],[750,.1]],win:[[523,.12],[659,.12],[784,.12],[1047,.12],[784,.12],[1047,.4]],step:[[330,.08,'triangle'],[392,.08,'triangle']]};

/* tips */
const TIPS=["Perimeter is the distance around a figure. Add the length of every side.","Rectangle: P = 2 × (length + width). Square: P = 4 × side.","Regular polygon: all sides are equal, so P = number of sides × one side.","Perimeter is measured in length units like cm, m, in or ft, never in square units.","Missing side? Add the known sides, then subtract that total from the perimeter.","Compound figure: measure only the outside edge. Do not count the lines inside.","Drawing: measure each side along its border with the ruler, then add the sides to check the perimeter.","Explorer: note each side you reveal, then add them all.","Predict the error: check every step of the solution against the figure. Only one step is wrong.","Farm missions: flip each card, read the plot and answer its perimeter. You get +10 seconds for every crop."];

rs.setProperty('--cpen',cu(`<path d='M3 29l2-8L21 5l6 6L11 27z' fill='#ffc93c' stroke='#1b2a49' stroke-width='2' stroke-linejoin='round'/><path d='M3 29l2-8 6 6z' fill='#f6d7b0' stroke='#1b2a49' stroke-width='2' stroke-linejoin='round'/><path d='M21 5l3-3 6 6-3 3z' fill='#ef476f' stroke='#1b2a49' stroke-width='2' stroke-linejoin='round'/>`,3,29,'crosshair'));
rs.setProperty('--clens',cu(`<circle cx='12' cy='12' r='8' fill='rgba(255,255,255,.55)' stroke='#1b2a49' stroke-width='3'/><path d='M18 18l10 10' stroke='#7b5cff' stroke-width='5' stroke-linecap='round'/>`,12,12,'zoom-in'));

/* setup window */

$('#cN').innerHTML=NQ.map(n=>`<button data-v="${n}" class="${cfg.n==n?'on':''}" aria-pressed="${cfg.n==n}">${n}</button>`).join('');
$('#cM').innerHTML=MODES.map(m=>`<button class="mcard ${cfg.modes.has(m[0])?'on':''}" data-m="${m[0]}" aria-pressed="${cfg.modes.has(m[0])}"><b>${m[2]}</b>${m[1]}<small>${m[3]}</small></button>`).join('');
$('#go').disabled=!cfg.modes.size;$('#mh').hidden=!!cfg.modes.size}
$('#cT').onclick=e=>{const b=e.target.closest('button');if(b){cfg.time=+b.dataset.v;drawSetup()}};

/* hourglass timer */
let TS=30,tr=30,tid=null,tend=0,ls=null;

sS.style.display=tid&&tr>0?'':'none';sS.setAttribute('y2',136-(61-h));const c=Math.ceil(tr-1e-9);$('#td').textContent=c>=60?Math.floor(c/60)+":"+String(c%60).padStart(2,"0"):c+" s"}
function tstop(){clearInterval(tid);tid=null;tdraw()}
function trun(){clearInterval(tid);tend=Date.now()+tr*1000;tid=setInterval(()=>{tr=(tend-Date.now())/1000;const c=Math.ceil(tr);
if(tr<=0){tr=0;clearInterval(tid);tid=null;$('#td').classList.add('end');$('#hg').classList.add('end');snd('alarm');toast("⌛ Time's up!")}else if(c<=3&&c!=ls){ls=c;snd('tick')}tdraw()},100)}
function tstart(s){clearInterval(tid);tid=null;TS=tr=s;ls=null;$('#tp2').textContent='⏸';$('#td').classList.remove('end');const g=$('#hg');g.classList.remove('end','flip');void g.getBoundingClientRect();g.classList.add('flip');tdraw();trun()}

/* nav */
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id))}
function startGame(){const m=[...cfg.modes];queue=[];let bag=[];while(queue.length<cfg.n){if(!bag.length)bag=shuf(m);queue.push(bag.pop())}qi=0;$('#fin').classList.remove('on');show('game');next()}
function finish(){tstop();$('#fn').textContent=`You finished ${queue.length} questions. Great work!`;$('#fin').classList.add('on');snd('win');burst(["🏆","🎉","🥇","🎊","⭐","✨"],34,'up')}
function next(){clearTimeout(advance);if(qi>=queue.length)return finish();const t=queue[qi++];snd('next');
$('#qn').textContent=`Question ${qi} of ${queue.length}`;$('#chip').textContent=NAMES[t];$('#skip').textContent=qi>=queue.length?"Finish 🏁":"Next ▶";tip(TT[t]);
$('#vis').dataset.cur=CUR[t];$('#vis').scrollTop=0;$('#jbar').hidden=true;$('#tm').classList.remove('hasj');FX=0;({c:CQ,k:K,j:J,x:X,u:Uk,d:D,e:PE})[t]();tstart(cfg.time+FX)}
$('#start').onclick=()=>{snd('start');show('setup');drawSetup()};
$('#go').onclick=()=>{if(cfg.modes.size){snd('start');startGame()}};
$('#home').onclick=()=>{clearTimeout(advance);tstop();show('intro')};
$('#skip').onclick=()=>next();$('#nt').onclick=nextTip;$('#mute').onclick=()=>{mute=!mute;$('#mute').textContent=mute?'🔇':'🔊'};
$('#again').onclick=startGame;$('#fhome').onclick=()=>{$('#fin').classList.remove('on');show('setup');drawSetup()};
function render(v,u){$('#visin').innerHTML=v;$('#ui').innerHTML=u+'<div id="fb" class="fb" aria-live="polite"></div>';const x=$('#ans');if(x)x.onkeydown=e=>{if(e.key=="Enter")$('#chk').click()}}
tdraw();
/* geometry */
const dist=(a,b)=>Math.round(Math.hypot(a[0]-b[0],a[1]-b[1])*100)/100,NM={3:"triangle",4:"quadrilateral",5:"pentagon",6:"hexagon",7:"heptagon",8:"octagon",9:"nonagon"};
const rpts=n=>[...Array(n)].map((_,i)=>[Math.cos(i*2*Math.PI/n-1.5708),Math.sin(i*2*Math.PI/n-1.5708)]);
function comp(t){t=t||pick(["house","two","bump"]);const c=shuf(PAL);let parts,pts,name;
if(t=="house"){const[w,rh]=pick([[6,4],[8,3],[12,8]]),h=R(3,7);parts=[{pts:[[0,0],[w,0],[w,h],[0,h]],col:c[0]},{pts:[[0,0],[w/2,-rh],[w,0]],col:c[1]}];pts=[[0,0],[w/2,-rh],[w,0],[w,h],[0,h]];name="house-shaped figure"}
else if(t=="two"){const a=R(6,12),d=R(6,12),cc=R(2,a-2),b=R(2,d-2);parts=[{pts:[[0,0],[a,0],[a,b],[0,b]],col:c[0]},{pts:[[0,b],[cc,b],[cc,d],[0,d]],col:c[1]}];pts=[[0,0],[a,0],[a,b],[cc,b],[cc,d],[0,d]];name="figure made of two rectangles"}
else{const w=R(7,12),h=R(3,6),s=R(2,4),x=R(1,w-s-1);parts=[{pts:[[0,0],[w,0],[w,h],[0,h]],col:c[0]},{pts:[[x,-s],[x+s,-s],[x+s,0],[x,0]],col:c[1]}];pts=[[0,0],[x,0],[x,-s],[x+s,-s],[x+s,0],[w,0],[w,h],[0,h]];name="figure made of a rectangle and a square"}
const L=pts.map((p,i)=>dist(p,pts[(i+1)%pts.length]));return{pts,L,shown:pts.map((_,i)=>i),name,k:"comp",parts}}
function shape(k){if(k=="comp")return comp();let pts,L,shown,name,ticks;
if(k=="rect"){let l=R(5,12),w=R(2,l-2);pts=[[0,0],[l,0],[l,w],[0,w]];shown=[0,1];name="rectangle"}
else if(k=="square"){let s=R(3,12);pts=[[0,0],[s,0],[s,s],[0,s]];shown=[0];name="square"}
else if(k=="tri"){let[a,b,c]=pick([[3,4,5],[5,5,6],[6,8,10],[5,12,13],[4,4,4],[7,7,5],[6,6,6],[9,12,15]]),x=(b*b+c*c-a*a)/(2*c),y=Math.sqrt(Math.max(.01,b*b-x*x));pts=[[0,0],[c,0],[x,-y]];L=[c,a,b];shown=[0,1,2];name="triangle"}
else if(k=="L"){let a=R(6,12),d=R(6,12),c=R(2,a-2),b=R(2,d-2);pts=[[0,0],[a,0],[a,b],[c,b],[c,d],[0,d]];shown=[0,1,2,3,4,5];name="L-shaped figure"}
else if(k=="reg"){const n=pick([3,5,6,7,8,9]);pts=rpts(n);L=Array(n).fill(R(3,10));shown=[0];ticks=true;name="regular "+NM[n]}
else{const n=pick([5,6,7,8,9]);pts=rpts(n).map(p=>{const a=Math.atan2(p[1],p[0])+(Math.random()-.5)*.3,r=.75+Math.random()*.4;return[Math.cos(a)*r,Math.sin(a)*r]});L=pts.map(()=>R(3,12));shown=pts.map((_,i)=>i);name="irregular "+NM[n]}
L=L||pts.map((p,i)=>dist(p,pts[(i+1)%pts.length]));return{pts,L,shown,name,k,ticks}}
function place(P,off,fs,W,H,act){const n=P.length;let ar=0;P.forEach((a,i)=>{const b=P[(i+1)%n];ar+=a[0]*b[1]-b[0]*a[1]});const sg=ar>0?1:-1;
const Q=P.map((a,i)=>{const b=P[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[(a[0]+b[0])/2+sg*dy/l*off,(a[1]+b[1])/2-sg*dx/l*off]});
const kx=fs*3.2,ky=fs*1.5;
for(let it=0;it<60;it++)for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(!act[i]||!act[j])continue;let dx=Q[i][0]-Q[j][0],dy=Q[i][1]-Q[j][1];const e=Math.hypot(dx/kx,dy/ky);if(e<1){let l=Math.hypot(dx,dy);if(l<.01){dx=1;dy=.3;l=Math.hypot(dx,dy)}const f=(1-e)*ky*.4+.3;Q[i][0]+=dx/l*f;Q[i][1]+=dy/l*f;Q[j][0]-=dx/l*f;Q[j][1]-=dy/l*f}}
Q.forEach(q=>{q[0]=Math.max(kx/2,Math.min(W-kx/2,q[0]));q[1]=Math.max(ky,Math.min(H-ky,q[1]))});return Q}
function svg(pts,lab,o){o=o||{};const W=360,H=240,fs=o.fs||15,p=o.p||fs*3.4,xs=pts.map(a=>a[0]),ys=pts.map(a=>a[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0||1,h=Math.max(...ys)-y0||1,k=Math.min((W-2*p)/w,(H-2*p)/h),ox=(W-w*k)/2,oy=(H-h*k)/2;
const tf=a=>[ox+(a[0]-x0)*k,oy+(a[1]-y0)*k],P=pts.map(tf),n=P.length,f1=q=>q.map(a=>{const t=tf(a);return t[0].toFixed(1)+","+t[1].toFixed(1)}).join(" "),parts=o.parts||[{pts,col:o.col||pick(PAL)}];
const Q=place(P,fs*1.6,fs,W,H,lab.map(Boolean));let t="",tk="";
P.forEach((a,i)=>{const b=P[(i+1)%n];if(lab[i])t+=`<text x="${Q[i][0].toFixed(1)}" y="${Q[i][1].toFixed(1)}" style="font-size:${fs}px">${lab[i]}</text>`;
if(o.ticks){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=dy/l*7,ny=-dx/l*7;tk+=`<line x1="${(mx-nx).toFixed(1)}" y1="${(my-ny).toFixed(1)}" x2="${(mx+nx).toFixed(1)}" y2="${(my+ny).toFixed(1)}"/>`}});

const fig=(pts,lab,o)=>`<div class="fbox">${svg(pts,lab,o)}</div>`,so=sh=>({ticks:sh.ticks,parts:sh.parts});
const labels=(sh,u,hide)=>sh.L.map((v,i)=>sh.shown.includes(i)?(i===hide?"?":v+" "+u):"");
const NOTES={irr:"Not drawn to scale.",reg:"All sides are equal (see the tick marks).",comp:"Measure only the outside edge of the whole figure."},note=sh=>NOTES[sh.k]?`<p class="note">${NOTES[sh.k]}</p>`:"";
/* 1 Questions */
function Q(){const kind=pick(["rect","square","tri","L","reg","comp"]),sh=shape(kind),u=pick(["m","cm","ft"]),L=sh.L,ans=sum(L),n=L.length;
const story={rect:`A rectangular garden is ${L[0]} ${u} long and ${L[1]} ${u} wide. How much fence is needed to go around it?`,square:`A square plaza has sides of ${L[0]} ${u}. How many ${u} of lights go around its edge?`,tri:`A triangular flag has edges of ${L.join(", ")} ${u}. How much ribbon goes around it?`,L:`A line is painted around this L-shaped playground. How long is the line?`,reg:`A regular ${NM[n]} tile has sides of ${L[0]} ${u}. How long is its border?`,comp:`A border goes around the outside of this ${sh.name}. How long is the border?`}[kind];
let d=new Set(kind=="rect"?[L[0]*L[1],L[0]+L[1],2*L[0]+L[1]]:kind=="square"?[L[0]*L[0],2*L[0],3*L[0]]:kind=="reg"?[(n-1)*L[0],(n+1)*L[0],L[0]*L[0]]:[]);d.delete(ans);
while(d.size<3){let v=ans+pick([-4,-3,-2,-1,1,2,3,4,5]);if(v>0&&v!=ans)d.add(v)}

if(v==P&&un==u){done=true;vis.dataset.cur='arrow';stp[bad].classList.remove('sel');stp[bad].classList.add('fixed');stp[bad].innerHTML=`<span>${st[bad][0]} · corrected</span>${cor}`;['#ans','#un','#chk','#chg'].forEach(q=>$(q).disabled=true);fb(1,fix)}
else if(v==P)fb(0,"The number is right, but check the unit of measure.");else fb(0,hint)}}
/* Drawing */
function D(){const cols=12,rows=9,S=36,PAD=30,T=10,W=cols*S+2*PAD,H=rows*S+2*PAD,u=pick(["m","cm","ft"]),ty=pick(["plain","rope","sum","formula","rect","square","pieces","L"]);let P,need="any",txt,a,b;
if(ty=="square"){const q=R(2,6);P=4*q;need="square";txt=`Draw a <b>square</b> with a perimeter of <b>${P} ${u}</b>.`}
else if(ty=="rect"){a=R(2,7);b=R(1,Math.min(6,a));P=2*(a+b);need="rect";txt=`Draw a <b>rectangle</b> with a perimeter of <b>${P} ${u}</b>.`}
else if(ty=="L"){P=2*R(4,11);need="L";txt=`Draw an <b>L-shaped</b> figure with a perimeter of <b>${P} ${u}</b>.`}
else if(ty=="sum"){a=R(2,7);b=R(1,6);P=2*(a+b);txt=`<b>P = ${a} + ${b} + ${a} + ${b} ${u}</b><br>Draw a figure with this perimeter.`}
else if(ty=="formula"){if(Math.random()<.5){a=R(2,7);b=R(1,6);P=2*(a+b);txt=`<b>P = 2 × (${a} + ${b}) ${u}</b>`}else{a=R(2,6);P=4*a;txt=`<b>P = 4 × ${a} ${u}</b>`}txt+="<br>Draw a figure with this perimeter."}
else if(ty=="rope"){P=2*R(4,12);txt=`🪢 A rope of <b>${P} ${u}</b> goes around a garden. Draw the garden.`}
else if(ty=="pieces"){P=2*R(4,12);txt=`🧱 You have <b>${P} ${u}</b> of fence. Use all of it to fence a figure.`}
else{P=2*R(4,12);txt=`Draw a figure with a perimeter of <b>${P} ${u}</b>.`}
let s=`<svg class="dsv" id="dsv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drawing grid with rulers"><rect width="${W}" height="${H}" rx="16" fill="#fffdf4"/>`;
s+=`<rect x="${PAD-12}" y="4" width="${cols*S+24}" height="${PAD-12}" rx="6" fill="#ffe9a3" stroke="#d9a920" stroke-width="1.5"/><rect x="4" y="${PAD-12}" width="${PAD-12}" height="${rows*S+24}" rx="6" fill="#ffe9a3" stroke="#d9a920" stroke-width="1.5"/><g stroke="#8a6a00" stroke-width="1.5" stroke-linecap="round">`;
for(let x=0;x<=cols;x++){const X=PAD+x*S;s+=`<line x1="${X}" y1="16" x2="${X}" y2="${PAD-8}"/>`;if(x<cols)s+=`<line x1="${X+S/2}" y1="19" x2="${X+S/2}" y2="${PAD-8}"/>`}
for(let y=0;y<=rows;y++){const Y=PAD+y*S;s+=`<line x1="16" y1="${Y}" x2="${PAD-8}" y2="${Y}"/>`;if(y<rows)s+=`<line x1="19" y1="${Y+S/2}" x2="${PAD-8}" y2="${Y+S/2}"/>`}
s+=`</g><g font-family="Fredoka,system-ui,sans-serif" font-size="11" font-weight="700" fill="#6b5000" text-anchor="middle" dominant-baseline="central">`;
for(let x=0;x<=cols;x++)s+=`<text x="${PAD+x*S}" y="9">${x}</text>`;
for(let y=0;y<=rows;y++)s+=`<text x="9" y="${PAD+y*S}">${y}</text>`;
s+=`</g>`;
for(let x=0;x<=cols;x++)s+=`<line x1="${PAD+x*S}" y1="${PAD}" x2="${PAD+x*S}" y2="${PAD+rows*S}" stroke="#d5e2f5" stroke-width="1.5"/>`;
for(let y=0;y<=rows;y++)s+=`<line x1="${PAD}" y1="${PAD+y*S}" x2="${PAD+cols*S}" y2="${PAD+y*S}" stroke="#d5e2f5" stroke-width="1.5"/>`;
for(let x=0;x<=cols;x++)for(let y=0;y<=rows;y++)s+=`<circle cx="${PAD+x*S}" cy="${PAD+y*S}" r="2.6" fill="#9fb5f0"/>`;
s+=`<g id="dfl"></g><g id="dpl"></g><g id="dlb" style="pointer-events:none"></g><line id="dgh" stroke="#2748b8" stroke-opacity=".35" stroke-width="8" stroke-linecap="round" style="display:none;pointer-events:none"/></svg>`;
render(`<div class="dwrap"><div class="dinfo"><div>${txt}</div><div class="dleg"><i></i> = 1 ${u}<br><small>Distance between two dots</small></div></div>${s}</div>`,`<p class="story">Click or drag along the grid lines to draw. Measure each side along its border with the ruler (top and left). Click a line again to erase it.</p><div class="row" style="margin:0"><button class="btn" id="clr" style="--c:#6c5ce7">Clear</button><button class="btn" id="chk" style="--c:#06a77d">Verify</button></div>`);
const sv=$('#dsv'),E=new Set(),gh=$('#dgh');let down=false,dm=null,lk=null,done=false;
const ec=k=>{const[x,y]=k.slice(1).split('_').map(Number),X=PAD+x*S,Y=PAD+y*S;return k[0]=='h'?[X,Y,X+S,Y]:[X,Y,X,Y+S]};
const pos=e=>{const r=sv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
function edgeAt(x,y){const gx=(x-PAD)/S,gy=(y-PAD)/S,ry=Math.round(gy),rx=Math.round(gx),dh=Math.abs(gy-ry)*S,dv=Math.abs(gx-rx)*S,cx=Math.floor(gx),cy=Math.floor(gy);let best=null,bd=T;
if(dh<bd&&cx>=0&&cx<cols&&ry>=0&&ry<=rows){best='h'+cx+'_'+ry;bd=dh}if(dv<bd&&cy>=0&&cy<rows&&rx>=0&&rx<=cols)best='v'+rx+'_'+cy;return best}
/* straight sides: each run of connected edges on the same line is one side, measured along its border */
function sides(){const r=[],hs=new Map(),vs=new Map();
E.forEach(k=>{const[x,y]=k.slice(1).split('_').map(Number);if(k[0]=='h'){if(!hs.has(y))hs.set(y,[]);hs.get(y).push(x)}else{if(!vs.has(x))vs.set(x,[]);vs.get(x).push(y)}});
const grp=(m,h)=>m.forEach((arr,c)=>{arr.sort((p,q)=>p-q);let s0=arr[0],p=s0;for(let i=1;i<=arr.length;i++){if(i<arr.length&&arr[i]==p+1){p=arr[i];continue}
r.push(h?{x1:s0,y1:c,x2:p+1,y2:c,len:p+1-s0}:{x1:c,y1:s0,x2:c,y2:p+1,len:p+1-s0});if(i<arr.length){s0=arr[i];p=s0}}});
grp(hs,1);grp(vs,0);return r}
const redraw=()=>{$('#dpl').innerHTML=[...E].map(k=>{const q=ec(k);return `<line x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}" stroke="#2748b8" stroke-width="6" stroke-linecap="round"/>`}).join("");
$('#dlb').innerHTML=sides().map(r=>{const mx=PAD+(r.x1+r.x2)/2*S,my=PAD+(r.y1+r.y2)/2*S;return `<g><rect x="${mx-13}" y="${my-10}" width="26" height="20" rx="10" fill="#fff" stroke="#2748b8" stroke-width="2"/><text x="${mx}" y="${my+1}" text-anchor="middle" dominant-baseline="central" font-family="Fredoka,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1b2a49">${r.len}</text></g>`}).join("")};
function editAt(px,py,first){if(done)return;
/* pressing exactly on a dot is ambiguous: wait for the drag direction */
if(first&&Math.abs((px-PAD)/S-Math.round((px-PAD)/S))*S<T&&Math.abs((py-PAD)/S-Math.round((py-PAD)/S))*S<T)return;const k=edgeAt(px,py);if(!k)return;const o=k[0],[kx,ky]=k.slice(1).split('_').map(Number);
/* dragging a side: ignore the edge that starts right at a corner until the pointer is clearly inside it, and ignore edges crossing the side */
if(!first){const f=o=='h'?(px-PAD)/S-kx:(py-PAD)/S-ky;if(f<.25||f>.75)return}
if(lk&&o!=lk.o){const d=lk.o=='h'?Math.abs(py-(PAD+lk.i*S)):Math.abs(px-(PAD+lk.i*S));if(d<S*.5)return}
lk={o,i:o=='h'?ky:kx};if(dm==null)dm=E.has(k)?'rm':'add';if(dm=='add'&&!E.has(k)){E.add(k);snd('step');redraw()}else if(dm=='rm'&&E.has(k)){E.delete(k);redraw()}}
let lp=null;
function drag(e){const q=pos(e);if(!lp){editAt(q[0],q[1],false);lp=q;return}const dx=q[0]-lp[0],dy=q[1]-lp[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));for(let i=1;i<=n;i++)editAt(lp[0]+dx*i/n,lp[1]+dy*i/n,false);lp=q}
sv.onpointerdown=e=>{if(e.button>0)return;e.preventDefault();try{sv.setPointerCapture(e.pointerId)}catch(_){}down=true;dm=null;lk=null;lp=pos(e);editAt(lp[0],lp[1],true)};
sv.onpointermove=e=>{if(down)drag(e);else if(!done){const k=edgeAt(...pos(e));if(k){const q=ec(k);gh.setAttribute('x1',q[0]);gh.setAttribute('y1',q[1]);gh.setAttribute('x2',q[2]);gh.setAttribute('y2',q[3]);gh.style.display=''}else gh.style.display='none'}};
sv.onpointerup=sv.onpointercancel=()=>{down=false;dm=null;lk=null;lp=null};sv.onpointerleave=()=>{if(!down)gh.style.display='none'};
function analyze(){const adj=new Map();E.forEach(k=>{const[x,y]=k.slice(1).split('_').map(Number),v1=x+','+y,v2=k[0]=='h'?(x+1)+','+y:x+','+(y+1);[[v1,v2],[v2,v1]].forEach(([p,q])=>{if(!adj.has(p))adj.set(p,[]);adj.get(p).push(q)})});
for(const[,l]of adj){if(l.length==1)return{err:"Your figure is not closed yet."};if(l.length>2)return{err:"Lines can't cross or branch."}}
const st=adj.keys().next().value,seen=new Set([st]),stk=[st];while(stk.length){const p=stk.pop();adj.get(p).forEach(q=>{if(!seen.has(q)){seen.add(q);stk.push(q)}})}
if(seen.size!=adj.size)return{err:"Draw only one figure."};
let corners=0;adj.forEach((l,p)=>{const[x,y]=p.split(',').map(Number),[m,n2]=l.map(q=>q.split(',').map(Number));if(!((m[0]==x&&n2[0]==x)||(m[1]==y&&n2[1]==y)))corners++});
const out=new Set(['-1,-1']),stack=[[-1,-1]];
while(stack.length){const[x,y]=stack.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,id=nx+','+ny;if(nx<-1||ny<-1||nx>cols||ny>rows||out.has(id))return;
const blk=dx==1?E.has('v'+(x+1)+'_'+y):dx==-1?E.has('v'+x+'_'+y):dy==1?E.has('h'+x+'_'+(y+1)):E.has('h'+x+'_'+y);if(!blk){out.add(id);stack.push([nx,ny])}})}
const cl=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!out.has(x+','+y))cl.push([x,y]);
const bw=Math.max(...cl.map(c=>c[0]))-Math.min(...cl.map(c=>c[0]))+1,bh=Math.max(...cl.map(c=>c[1]))-Math.min(...cl.map(c=>c[1]))+1;return{perim:E.size,cl,corners,bw,bh}}
$('#clr').onclick=()=>{if(done)return;E.clear();redraw();$('#fb').className='fb';$('#fb').innerHTML=''};
$('#chk').onclick=()=>{if(done)return;if(!E.size)return fb(0,"Draw your figure first.",1);const A=analyze();if(A.err)return fb(0,A.err);const sd=sides().map(r=>r.len);
if(A.perim!=P)return fb(0,`Your sides add up to ${sd.join(" + ")} = ${A.perim} ${u}. You need ${P} ${u}.`);
if((need=="rect"||need=="square")&&A.cl.length!=A.bw*A.bh)return fb(0,"The perimeter is right, but the figure must be a rectangle.");
if(need=="square"&&A.bw!=A.bh)return fb(0,"The perimeter is right, but the sides of a square are equal.");
if(need=="L"&&A.corners!=6)return fb(0,"The perimeter is right, but the figure must be L-shaped.");
done=true;gh.style.display='none';const col=pick(PAL);$('#dfl').innerHTML=A.cl.map(c=>`<rect class="dfc" x="${PAD+c[0]*S}" y="${PAD+c[1]*S}" width="${S}" height="${S}" fill="${col}"/>`).join("");
fb(1,`Your sides: ${sd.join(" + ")} = ${P} ${u}.`)}}
</script></body></html>
